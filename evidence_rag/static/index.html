<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG 资料问答</title>
  <style>
    :root { color-scheme: light; font: 16px/1.65 system-ui, sans-serif; color: #213047; background: #f4f6fa; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1200px; margin: 32px auto; padding: 0 24px 40px; }
    h1 { font-size: 30px; margin: 0 0 6px; }
    h2 { font-size: 20px; margin: 0 0 6px; }
    h3 { font-size: 16px; margin: 0 0 8px; }
    p { margin: 0 0 12px; }
    .muted { color: #68778d; font-size: 14px; }
    section { background: white; padding: 22px; border: 1px solid #e0e6ef; border-radius: 14px; margin: 18px 0; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    textarea { width: 100%; font: inherit; border: 1px solid #bcc9db; border-radius: 9px; padding: 12px; resize: vertical; min-height: 100px; }
    button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 9px 16px; background: #245ec9; color: white; }
    button.secondary { background: #edf2fa; color: #294566; }
    button:disabled { opacity: .55; cursor: default; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
    .results { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    .results section { min-width: 0; margin: 0; }
    .section-note { margin-bottom: 18px; }
    #answer, #answer-quotes, #source-content, .full-text { white-space: pre-wrap; overflow-wrap: anywhere; }
    #answer { font-size: 16px; line-height: 1.85; }
    #notice { color: #96591a; font-size: 14px; margin: 12px 0; }
    .badge { display: inline-block; font-size: 14px; border-radius: 6px; background: #eef4ff; color: #245294; padding: 3px 9px; margin-bottom: 12px; }
    article { border-top: 1px solid #e7edf5; padding: 16px 0; }
    article:first-child { border-top: 0; padding-top: 0; }
    details { margin: 10px 0; }
    summary { cursor: pointer; color: #31578b; font-size: 14px; }
    .full-text { font-size: 14px; margin-top: 10px; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 14px 0; }
    .metrics div { border: 1px solid #e1e9f3; border-radius: 10px; padding: 14px; background: #f9fbfe; }
    dt { color: #68778d; font-size: 14px; }
    dd { font-size: 22px; font-weight: 650; margin: 6px 0 0; }
    .hidden { display: none; }
    @media (max-width: 800px) { .results { grid-template-columns: 1fr; } main { margin-top: 22px; padding: 0 14px 30px; } }
    @media (max-width: 480px) { section { padding: 18px; } .metrics { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>RAG 资料问答</h1>
  <p class="muted">先检索资料，再生成答案；内容和耗时分开看。</p>
  <section>
    <form id="question-form">
      <label for="question">你想查什么？</label>
      <textarea id="question" required maxlength="4000" placeholder="输入问题，或需要核对的结论"></textarea>
      <div class="row">
        <button id="ask" type="submit">检索并生成答案</button>
        <button id="explore" type="button" class="secondary">只检索资料</button>
        <button id="stop" type="button" class="secondary" disabled>停止</button>
        <span id="status" role="status" aria-live="polite">等待提问</span>
      </div>
    </form>
  </section>
  <div class="results">
    <section aria-labelledby="evidence-title">
      <h2 id="evidence-title">1. 检索到的内容</h2>
      <p id="evidence-summary" class="muted section-note">这里展示知识库找到的资料。</p>
      <div id="evidence"><p class="muted">提问后，检索结果会显示在这里。</p></div>
    </section>
    <section aria-labelledby="answer-title">
      <h2 id="answer-title">2. AI 最终答案</h2>
      <p class="muted section-note">AI 根据检索资料作答，完成检查后在这里展示。</p>
      <div id="decision" class="badge hidden"></div>
      <div id="answer" aria-live="polite">等待生成答案。</div>
      <p id="notice" class="hidden"></p>
      <details id="quotes-panel" class="hidden">
        <summary>查看答案引用的原文摘录</summary>
        <div id="answer-quotes" class="full-text"></div>
      </details>
    </section>
  </div>
  <section aria-labelledby="timing-title">
    <h2 id="timing-title">3. 本次耗时</h2>
    <dl class="metrics">
      <div><dt>资料检索等待</dt><dd id="retrieval-time">—</dd></div>
      <div><dt>AI 生成与核验</dt><dd id="generation-time">—</dd></div>
      <div><dt>本次总等待</dt><dd id="total-time">—</dd></div>
    </dl>
    <p id="timing-note" class="muted">从本次点击开始计时；检索包含重排，生成包含引用检查及网络等待。</p>
  </section>
  <section id="source-panel" class="hidden">
    <h2>资料完整原文</h2>
    <div id="source-content"></div>
  </section>
</main>
<script type="module" src="/assets/workspace.mjs"></script>
</body>
</html>

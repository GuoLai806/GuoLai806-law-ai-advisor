[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-rag"
version = "0.2.0"
description = "Versioned evidence retrieval with an optional legal profile"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "jieba==0.42.1",
  "pydantic>=2,<3",
  "pymupdf>=1.24,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "numpy>=1.26,<3", "pyyaml>=6,<7"]
models = ["sentence-transformers>=6.2,<7", "transformers>=5.22,<6", "torch>=2.6,<3", "numpy>=1.26,<3"]

[project.scripts]
evidence-rag = "evidence_rag.cli:main"
legal-rag = "legal_rag.cli:main"

[tool.setuptools.packages.find]
include = ["evidence_rag*", "legal_rag*"]

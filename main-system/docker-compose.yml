services:
  evidence-rag:
    build:
      context: ..
      dockerfile: main-system/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      EVIDENCE_RAG_DB: /data/evidence.sqlite3
      EVIDENCE_RAG_AUTH: "${EVIDENCE_RAG_AUTH:-}"
    volumes:
      - evidence_data:/data
    restart: unless-stopped
volumes:
  evidence_data:
